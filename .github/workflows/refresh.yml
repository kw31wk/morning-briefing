name: Refresh morning briefing
on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"
permissions:
  contents: write
concurrency:
  group: briefing-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and prepare public RSS news feeds
        run: python scripts/refresh.py
      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Refresh morning briefing data"; git push; fi
