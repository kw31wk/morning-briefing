name: Refresh morning briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh.py'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: "0 15,16 * * *"
permissions:
  contents: write
concurrency:
  group: briefing-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run only at 8 AM Pacific
        id: local-time
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "$(TZ=America/Vancouver date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 8 AM Pacific; skipping this UTC schedule."
          fi
      - name: Fetch and prepare public RSS news feeds
        if: steps.local-time.outputs.run == 'true'
        run: python scripts/refresh.py
      - name: Publish refreshed data
        if: steps.local-time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Refresh morning briefing data"; git push; fi
